services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gemini-benchmark-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/outputs:/app/outputs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
    container_name: gemini-benchmark-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

